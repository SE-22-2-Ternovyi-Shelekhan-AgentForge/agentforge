services:
  gateway:
    build:
      context: ./agentforge-gateway/src/AgentForge.Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__orchestrator-cluster__Destinations__node1__Address=http://orchestrator:8080
      - Cors__AllowedOrigins__0=http://localhost:3000
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - agentforge-net

  orchestrator:
    build:
      context: ./agentforge-orchestrator/src/AgentForge.Orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AgentForgeDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      - DatabaseSettings__RunMigrationsOnStartup=true
      - RabbitMQ__Host=rabbitmq
      - Jwt__Issuer=AgentForge.Orchestrator
      - Jwt__Audience=AgentForge.Client
      - Jwt__Key=${JWT_KEY:-NmC8J1zqQDY2OpAmaRopvJ9VA8PoqPodm2bC92zmqnk}
      - Jwt__ExpiryMinutes=120
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - agentforge-net

  frontend:
    build:
      context: ./agentforge-web/agentforge-web
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - agentforge-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agentforge-sqlserver
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourSecurePassword123!", "-C", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - agentforge-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agentforge-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentforge-net

  ollama:
    image: ollama/ollama:latest
    container_name: agentforge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - agentforge-net

  # One-shot: pulls the agent model into the ollama volume, then exits.
  # Idempotent — on later runs the model is already cached and this returns fast.
  ollama-init:
    image: ollama/ollama:latest
    container_name: agentforge-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${AGENT_MODEL:-qwen2.5:7b}"]
    restart: "no"
    networks:
      - agentforge-net

  worker:
    build:
      context: ./agentforge-worker-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=${AGENT_MODEL:-qwen2.5:7b}
      - SUPERVISOR_MODEL=${AGENT_MODEL:-qwen2.5:7b}
    networks:
      - agentforge-net

networks:
  agentforge-net:
    driver: bridge

volumes:
  ollama-models:
  mssql-data: